name: Web App

# Runs on every PR so the `web-app` check can be required: the changes job
# skips the real work when nothing under web-app/ changed, and a skipped job
# satisfies a required check. Main pushes run this through deploy.yml.
on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      web-app: ${{ steps.diff.outputs.web-app }}
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect web-app changes
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "web-app=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(web-app/|\.github/workflows/web-app\.yml$)'; then
            echo "web-app=true" >> "$GITHUB_OUTPUT"
          else
            echo "web-app=false" >> "$GITHUB_OUTPUT"
          fi

  web-app:
    needs: changes
    if: needs.changes.outputs.web-app == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web-app
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      # actions/setup-node@v6.3.0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # ESLint and `node --test` (via tsx) both strip types without checking
      # them, so without this a type error first fails in the deploy build.
      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test
